services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caraul}
      POSTGRES_USER: ${POSTGRES_USER:-caraul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caraul_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: postgres://${POSTGRES_USER:-caraul}:${POSTGRES_PASSWORD:-caraul_password}@db:5432/${POSTGRES_DB:-caraul}
      APP_STATE_ID: ${APP_STATE_ID:-main}
    ports:
      - "${APP_PORT:-5173}:5173"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
