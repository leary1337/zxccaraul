<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Караул — варианты редизайна</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #090b0f; color: #f5f7fb; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    body { margin: 0; min-width: 1180px; }
    button, input, select { font: inherit; }
    .gallery { display: grid; gap: 44px; padding: 38px; }
    .concept {
      --bg: #111318; --surface: #1a1d24; --surface2: #222630; --line: #303642;
      --text: #f5f7fb; --muted: #959dac; --brand: #ff5a3d; --brandText: #fff;
      --good: #58d58d; --warn: #ffca62; --bad: #ff746d; --info: #72a7ff;
      --radius: 18px; --shadow: 0 22px 70px rgba(0,0,0,.35);
      width: 1840px; margin: 0 auto; padding: 34px; border-radius: 34px;
      background: color-mix(in srgb, var(--bg) 94%, #fff 6%); color: var(--text);
      box-shadow: 0 30px 100px rgba(0,0,0,.35);
    }
    .concept.light {
      --bg: #f4f5f7; --surface: #fff; --surface2: #f1f2f4; --line: #e2e4e9;
      --text: #1b1d22; --muted: #717681; --brand: #e93f2f; --brandText: #fff;
      --good: #16895a; --warn: #aa6b00; --bad: #cf3838; --info: #2563eb;
      --radius: 22px; --shadow: 0 18px 60px rgba(35,41,55,.12);
      background: #eceef2;
    }
    .concept.command {
      --bg: #08131c; --surface: #0e1f2b; --surface2: #132a39; --line: #274251;
      --text: #edf7f7; --muted: #86a3aa; --brand: #ffb21d; --brandText: #111820;
      --good: #4fe1a1; --warn: #ffb21d; --bad: #ff6b62; --info: #4cc9f0;
      --radius: 8px; --shadow: 0 24px 70px rgba(0,0,0,.45);
      background: #061019;
    }
    .concept-head { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; margin-bottom: 26px; }
    .eyebrow { color: var(--brand); font-size: 14px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .concept h1 { margin: 7px 0 8px; font-size: 38px; letter-spacing: -.04em; }
    .concept-head p { max-width: 980px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .palette { display: flex; gap: 8px; }
    .swatch { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--bg) 80%, transparent); }
    .screen-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; align-items: start; }
    .screen-label { margin: 0 0 9px 5px; color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .phone {
      position: relative; display: flex; flex-direction: column; width: 100%; height: 640px;
      overflow: hidden; border: 1px solid var(--line); border-radius: calc(var(--radius) + 12px);
      background: var(--bg); box-shadow: var(--shadow);
    }
    .phone::before { content: ""; position: absolute; z-index: 8; top: 7px; left: 50%; width: 62px; height: 16px; transform: translateX(-50%); border-radius: 20px; background: color-mix(in srgb, var(--text) 12%, var(--bg)); }
    .statusbar { display: flex; justify-content: space-between; padding: 10px 14px 3px; color: var(--muted); font-size: 9px; font-weight: 750; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 49px; padding: 7px 13px 9px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 84%, transparent); }
    .brand { display: grid; gap: 2px; }
    .brand strong { font-size: 15px; letter-spacing: -.02em; }
    .brand small { color: var(--muted); font-size: 9px; }
    .avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); color: var(--brand); font-size: 11px; font-weight: 900; }
    .content { flex: 1; min-height: 0; overflow: hidden; padding: 12px 11px 74px; }
    .page-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 11px; }
    .page-head h2 { margin: 0; font-size: 19px; letter-spacing: -.035em; }
    .page-head p { margin: 3px 0 0; color: var(--muted); font-size: 9px; }
    .icon-action { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 11px; font-weight: 800; }
    .primary { border: 0; background: var(--brand); color: var(--brandText); }
    .date-switch { display: grid; grid-template-columns: 30px 1fr 30px; gap: 6px; margin-bottom: 10px; }
    .date-switch span, .date-switch b { display: grid; place-items: center; min-height: 31px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 10px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .metric { padding: 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .metric strong { display: block; font-size: 18px; line-height: 1; }
    .metric span { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; line-height: 1.15; }
    .card { margin-bottom: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .card-head strong { font-size: 12px; }
    .card-head small { color: var(--muted); font-size: 8px; }
    .badge { display: inline-flex; align-items: center; min-height: 21px; padding: 0 7px; border-radius: 99px; background: color-mix(in srgb, var(--brand) 16%, var(--surface2)); color: var(--brand); font-size: 8px; font-weight: 850; white-space: nowrap; }
    .badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--surface2)); }
    .badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, var(--surface2)); }
    .badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface2)); }
    .person, .compact-row { display: grid; grid-template-columns: 27px 1fr auto; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
    .compact-row.date-row { grid-template-columns: 42px 1fr auto; }
    .date-label { color: var(--brand); font-size: 9px; font-weight: 850; }
    .person:first-of-type, .compact-row:first-of-type { border-top: 0; }
    .person .num, .mini-avatar { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; background: var(--surface2); color: var(--muted); font-size: 9px; font-weight: 850; }
    .person b, .compact-row b { display: block; overflow: hidden; font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
    .person small, .compact-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 7.5px; }
    .empty-slot { padding: 9px; border: 1px dashed color-mix(in srgb, var(--brand) 55%, var(--line)); border-radius: var(--radius); color: var(--brand); font-size: 9px; font-weight: 800; }
    .wide-action { width: 100%; min-height: 34px; margin-top: 7px; border: 0; border-radius: var(--radius); background: var(--brand); color: var(--brandText); font-size: 10px; font-weight: 850; }
    .search { display: flex; align-items: center; min-height: 34px; margin-bottom: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--muted); font-size: 9px; }
    .chips { display: flex; gap: 5px; overflow: hidden; margin-bottom: 9px; }
    .chip { flex: 0 0 auto; padding: 6px 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); font-size: 8px; font-weight: 750; }
    .chip.active { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 15%, var(--surface)); color: var(--brand); }
    .bar-row { display: grid; grid-template-columns: 76px 1fr 22px; align-items: center; gap: 7px; margin: 10px 0; }
    .bar-row span { overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 7px; overflow: hidden; border-radius: 20px; background: var(--surface2); }
    .bar i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
    .bar-row b { color: var(--muted); font-size: 8px; text-align: right; }
    .equipment { margin-bottom: 7px; padding: 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .equipment .title { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .equipment .title b { font-size: 10px; }
    .equipment dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 0; }
    .equipment dt { color: var(--muted); font-size: 7px; }
    .equipment dd { margin: 2px 0 0; font-size: 8.5px; font-weight: 750; }
    .nav { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 5px 10px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); }
    .nav span { display: grid; place-items: center; gap: 3px; color: var(--muted); font-size: 7px; }
    .nav i { font-style: normal; font-size: 14px; }
    .nav .active { color: var(--brand); font-weight: 850; }
    .login-content { display: grid; align-content: center; flex: 1; padding: 22px 16px 64px; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 14px; border-radius: var(--radius); background: var(--brand); color: var(--brandText); font-size: 22px; font-weight: 950; }
    .login-content h2 { margin: 0 0 5px; font-size: 22px; }
    .login-content > p { margin: 0 0 15px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .field { margin-bottom: 8px; }
    .field label { display: block; margin: 0 0 4px 2px; color: var(--muted); font-size: 8px; font-weight: 750; }
    .input { display: flex; align-items: center; min-height: 35px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--muted); font-size: 9px; }
    .or { display: flex; align-items: center; gap: 7px; margin: 12px 0; color: var(--muted); font-size: 8px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .start-card { padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .start-card b { font-size: 10px; }
    .start-card p { margin: 4px 0 8px; color: var(--muted); font-size: 8px; }
    .section-title { margin: 30px 0 14px; font-size: 20px; letter-spacing: -.025em; }
    .case-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .case { min-height: 350px; padding: 14px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px); background: var(--surface); }
    .case-kicker { color: var(--brand); font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .case h3 { margin: 5px 0 4px; font-size: 15px; }
    .case > p { min-height: 34px; margin: 0 0 12px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .sheet { margin-top: 8px; padding: 11px; border: 1px solid var(--line); border-radius: calc(var(--radius) + 2px); background: var(--bg); }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; font-size: 10px; font-weight: 850; }
    .option { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 34px; margin: 5px 0; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface2); font-size: 8px; }
    .option b { font-size: 8.5px; }
    .option small { color: var(--muted); font-size: 7px; }
    .option.selected { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .status { display: grid; place-items: center; min-height: 38px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface2); font-size: 8px; text-align: center; }
    .status.active { border-color: var(--brand); color: var(--brand); }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
    .calendar span { display: grid; place-items: center; height: 21px; border-radius: 5px; color: var(--muted); font-size: 7px; }
    .calendar .range { background: color-mix(in srgb, var(--brand) 18%, var(--surface2)); color: var(--text); }
    .calendar .edge { background: var(--brand); color: var(--brandText); }
    .vacation-pill { display: flex; justify-content: space-between; margin: 5px 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 8px; }
    .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: var(--radius); background: var(--surface2); }
    .toggle span { padding: 6px; border-radius: calc(var(--radius) - 3px); color: var(--muted); font-size: 8px; text-align: center; }
    .toggle .on { background: var(--surface); color: var(--brand); font-weight: 800; }
    .preview { position: relative; min-height: 185px; overflow: hidden; border-radius: var(--radius); background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 18%, var(--bg)), var(--surface2)); }
    .preview::after { content: "КАРАУЛ №1\A 26 СЕНТЯБРЯ"; white-space: pre; position: absolute; inset: 18px; display: grid; align-content: start; color: var(--text); font-size: 18px; font-weight: 950; line-height: 1.15; }
    .preview-lines { position: absolute; z-index: 1; left: 18px; right: 18px; bottom: 18px; display: grid; gap: 7px; }
    .preview-lines i { height: 7px; border-radius: 9px; background: color-mix(in srgb, var(--text) 72%, transparent); }
    .preview-lines i:nth-child(2) { width: 80%; }.preview-lines i:nth-child(3) { width: 62%; }
    .light .phone::before { background: #d8dbe2; }
    .light .topbar, .light .nav { background: rgba(255,255,255,.92); }
    .light .card, .light .metric, .light .search, .light .equipment, .light .input { box-shadow: 0 7px 22px rgba(35,41,55,.055); }
    .light .primary, .light .wide-action { box-shadow: 0 8px 20px rgba(233,63,47,.23); }
    .light .phone { border-color: #d7dae1; }
    .light .access-avatar, .light .mini-avatar, .light .person .num { background: #eceef2; }
    .command { font-family: "Segoe UI", Arial, sans-serif; }
    .command .concept-head h1, .command .page-head h2, .command .card-head strong { letter-spacing: -.015em; }
    .command .topbar { border-bottom: 2px solid var(--brand); }
    .command .metric strong { color: var(--brand); font-family: Consolas, monospace; }
    .command .card, .command .metric, .command .equipment, .command .case { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--brand) 65%, transparent); }
    .command .nav .active { background: color-mix(in srgb, var(--brand) 12%, transparent); }
    .command .nav span { padding: 4px 0; border-radius: 4px; }
    .footer-note { display: flex; justify-content: space-between; gap: 20px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <main class="gallery" id="gallery"></main>
  <script>
    const variants = [
      { key: "signal", cls: "", index: "01", title: "Оперативный сигнал", note: "Развитие текущей тёмной темы: быстрее считываются смена, тревожные состояния и главное действие. Подходит для работы в помещении и ночью.", colors: ["#111318","#1a1d24","#ff5a3d","#58d58d","#ffca62"] },
      { key: "light", cls: "light", index: "02", title: "Светлый штаб", note: "Спокойный светлый интерфейс для дневной работы: больше воздуха, мягкие карточки, красный остаётся фирменным акцентом и не перегружает экран.", colors: ["#f4f5f7","#ffffff","#e93f2f","#16895a","#2563eb"] },
      { key: "command", cls: "command", index: "03", title: "Командный контур", note: "Техническая тёмно-синяя система с янтарным акцентом. Выше плотность данных, чётче статусы и инвентарные сущности, меньше декоративности.", colors: ["#08131c","#0e1f2b","#ffb21d","#4fe1a1","#4cc9f0"] }
    ];

    const nav = (active) => `<div class="nav">${[["▦","Раскладка","roster"],["▥","Статистика","stats"],["☷","Сотрудники","employees"],["⚒","Работа","work"],["⚙","Доступ","access"]].map(([i,l,k]) => `<span class="${active===k?"active":""}"><i>${i}</i>${l}</span>`).join("")}</div>`;
    const shell = (label, active, body, noNav=false) => `<div><p class="screen-label">${label}</p><section class="phone"><div class="statusbar"><span>09:41</span><span>●●● 87%</span></div>${noNav?"":`<div class="topbar"><div class="brand"><strong>Караул</strong><small>1-й караул · сегодня</small></div><span class="avatar">АС</span></div>`}${body}${noNav?"":nav(active)}</section></div>`;
    const roster = () => shell("Раскладка", "roster", `<div class="content"><div class="page-head"><div><h2>Раскладка</h2><p>Смена на 26 сентября</p></div><button class="icon-action primary">PNG</button></div><div class="date-switch"><span>‹</span><b>26 сентября</b><span>›</span></div><div class="metrics"><div class="metric"><strong>12</strong><span>в строю</span></div><div class="metric"><strong>3</strong><span>отсутствуют</span></div><div class="metric"><strong>1</strong><span>место свободно</span></div></div><div class="card"><div class="card-head"><strong>1-й ход</strong><span class="badge good">4 / 4</span></div><div class="person"><span class="num">1</span><span><b>Соколов А.П.</b><small>Начальник караула · РТП</small></span><span>›</span></div><div class="person"><span class="num">2</span><span><b>Иванов Д.С.</b><small>Водитель</small></span><span>›</span></div></div><div class="card"><div class="card-head"><strong>Резервный водитель</strong><span class="badge warn">на 28.09</span></div><div class="person"><span class="num">1</span><span><b>Петров М.В.</b><small>Последний резерв: 12.09</small></span><span>›</span></div></div><div class="card"><div class="card-head"><strong>Отсутствующие</strong><small>3 сотрудника</small></div><div class="compact-row"><span class="mini-avatar">К</span><span><b>Кузнецов И.А.</b><small>Основной отпуск · до 02.10</small></span><span class="badge warn">Отпуск</span></div></div></div>`);
    const stats = () => shell("Статистика", "stats", `<div class="content"><div class="page-head"><div><h2>Статистика</h2><p>Январь — декабрь 2026</p></div><button class="icon-action">⌄</button></div><div class="metrics"><div class="metric"><strong>48</strong><span>отгулов</span></div><div class="metric"><strong>31</strong><span>больничных</span></div><div class="metric"><strong>14</strong><span>сотрудников</span></div></div><div class="chips"><span class="chip active">Все</span><span class="chip">Отгулы</span><span class="chip">Больничные</span></div><div class="search">⌕ Поиск сотрудника</div><div class="card"><div class="card-head"><strong>Дни отсутствия</strong><small>по сотрудникам</small></div><div class="bar-row"><span>Соколов А.П.</span><div class="bar"><i style="width:82%"></i></div><b>14</b></div><div class="bar-row"><span>Иванов Д.С.</span><div class="bar"><i style="width:58%"></i></div><b>9</b></div><div class="bar-row"><span>Петров М.В.</span><div class="bar"><i style="width:38%"></i></div><b>6</b></div><div class="bar-row"><span>Орлов В.Н.</span><div class="bar"><i style="width:25%"></i></div><b>4</b></div></div><div class="card"><div class="card-head"><strong>По видам</strong><span class="badge">Настроить</span></div><div class="compact-row"><span class="badge warn">О</span><span><b>Отгулы</b><small>48 дней за период</small></span><b>61%</b></div><div class="compact-row"><span class="badge bad">Б</span><span><b>Больничные</b><small>31 день за период</small></span><b>39%</b></div></div></div>`);
    const employees = () => shell("Сотрудники", "employees", `<div class="content"><div class="page-head"><div><h2>Сотрудники</h2><p>Личный состав · 14</p></div><button class="icon-action primary">＋</button></div><div class="search">⌕ Фамилия или должность</div><div class="chips"><span class="chip active">Активные 14</span><span class="chip">Архив 2</span><span class="chip">Водители 5</span></div><div class="card"><div class="compact-row"><span class="mini-avatar">С</span><span><b>Соколов Андрей</b><small>Начальник караула · РТП</small></span><span>›</span></div><div class="compact-row"><span class="mini-avatar">И</span><span><b>Иванов Дмитрий</b><small>Водитель · ГДЗС</small></span><span>›</span></div><div class="compact-row"><span class="mini-avatar">К</span><span><b>Кузнецов Илья</b><small>Пожарный</small></span><span>›</span></div><div class="compact-row"><span class="mini-avatar">П</span><span><b>Петров Максим</b><small>Водитель</small></span><span>›</span></div></div><div class="card"><div class="card-head"><strong>Ближайшие отпуска</strong><span class="badge warn">2</span></div><div class="compact-row date-row"><span class="date-label">28.09</span><span><b>Кузнецов И.А.</b><small>Основной · 14 дней</small></span><span>›</span></div><div class="compact-row date-row"><span class="date-label">12.10</span><span><b>Орлов В.Н.</b><small>Учебный · 5 дней</small></span><span>›</span></div></div></div>`);
    const work = () => shell("Работа", "work", `<div class="content"><div class="page-head"><div><h2>Работа</h2><p>ПТВ подразделения</p></div><button class="icon-action primary">＋</button></div><div class="search">🚒 АЦ-3,2-40 / Все места</div><div class="chips"><span class="chip active">ПТВ</span><span class="chip">ГАСИ</span><span class="chip">РХБЗ</span><span class="chip">Мотопомпы</span></div><div class="metrics"><div class="metric"><strong>42</strong><span>позиций</span></div><div class="metric"><strong>38</strong><span>исправно</span></div><div class="metric"><strong>4</strong><span>проверить</span></div></div><div class="equipment"><div class="title"><b>Ствол пожарный РСК-50</b><span class="badge good">Исправно</span></div><dl><div><dt>Номер</dt><dd>431243</dd></div><div><dt>Место</dt><dd>АЦ-720 · отсек 3</dd></div></dl></div><div class="equipment"><div class="title"><b>Багор цельнометаллический</b><span class="badge bad">1 неиспр.</span></div><dl><div><dt>Экземпляры</dt><dd>2 шт.</dd></div><div><dt>Место</dt><dd>АЦ-720 / склад</dd></div></dl></div><div class="equipment"><div class="title"><b>Противогаз ГП-7</b><span class="badge good">Исправно</span></div><dl><div><dt>Учёт</dt><dd>123 шт.</dd></div><div><dt>Место</dt><dd>Склад РХБЗ</dd></div></dl></div></div>`);
    const access = () => shell("Доступ", "access", `<div class="content"><div class="page-head"><div><h2>Доступ</h2><p>Караул, участники и роли</p></div><button class="icon-action">⋯</button></div><div class="card"><div class="card-head"><span><strong>1-й караул</strong><small style="display:block;margin-top:3px">Главный администратор</small></span><span class="badge">Сменить</span></div><button class="wide-action">＋ Новый караул</button></div><div class="card"><div class="card-head"><strong>Участники</strong><span class="badge">8</span></div><div class="compact-row"><span class="mini-avatar">АС</span><span><b>Алексей Соколов</b><small>Главный администратор</small></span><span class="badge warn">Владелец</span></div><div class="compact-row"><span class="mini-avatar">ДИ</span><span><b>Дмитрий Иванов</b><small>Редактор</small></span><span>⌄</span></div><div class="compact-row"><span class="mini-avatar">МК</span><span><b>Мария Котова</b><small>Наблюдатель</small></span><span>⌄</span></div></div><div class="card"><div class="card-head"><strong>Роли</strong><span class="badge">4</span></div><div class="compact-row"><span>◆</span><span><b>Администратор</b><small>10 из 10 прав</small></span><span>⌄</span></div><div class="compact-row"><span>◇</span><span><b>Редактор</b><small>7 из 10 прав</small></span><span>⌄</span></div></div></div>`);
    const entry = () => shell("Вход и первый запуск", "", `<div class="login-content"><div class="mark">К</div><h2>Добро пожаловать</h2><p>Войдите, чтобы открыть свой караул и продолжить работу.</p><div class="field"><label>Логин</label><div class="input">Введите логин</div></div><div class="field"><label>Пароль</label><div class="input">••••••••</div></div><button class="wide-action">Войти</button><div class="or">или</div><div class="start-card"><b>Новый пользователь?</b><p>Регистрация создаёт аккаунт. Караул можно создать после входа или присоединиться по ссылке.</p><span class="badge">Создать аккаунт</span></div><div class="start-card" style="margin-top:7px"><b>Караул не выбран</b><p>Создайте новый или откройте ссылку-приглашение.</p><span class="badge good">＋ Создать караул</span></div></div>`, true);

    const cases = () => `
      <article class="case"><span class="case-kicker">01 · Назначение</span><h3>Выбор сотрудника</h3><p>Свободные сверху, занятые и отсутствующие видны до выбора. Резервные водители отсортированы по очереди.</p><div class="sheet"><div class="sheet-title"><span>Резервный водитель</span><span>×</span></div><div class="search">⌕ Найти сотрудника</div><div class="option selected"><span><b>Петров М.В.</b><small>Ещё не был резервным</small></span><span class="badge good">Следующий</span></div><div class="option"><span><b>Иванов Д.С.</b><small>Последний резерв: 12.09</small></span><span>›</span></div><div class="option"><span><b>Орлов В.Н.</b><small>Назначен: 2-й ход</small></span><span class="badge warn">Занят</span></div></div></article>
      <article class="case"><span class="case-kicker">02 · Отсутствия</span><h3>Статус и отпуск</h3><p>Сначала причина отсутствия, затем вид отпуска. Период выбирается единым календарём.</p><div class="sheet"><div class="sheet-title"><span>Статус сотрудника</span><span>×</span></div><div class="status-grid"><span class="status">Отгул</span><span class="status">Больничный</span><span class="status active">Отпуск ›</span><span class="status">Командировка</span><span class="status">Подмена</span><span class="status">Другое</span></div><div class="chips" style="margin-top:8px"><span class="chip active">Основной</span><span class="chip">Учебный</span><span class="chip">Донорский</span></div><div class="calendar">${Array.from({length:35},(_,i)=>`<span class="${i===11||i===22?"edge":i>11&&i<22?"range":""}">${i<3?"":i-2}</span>`).join("")}</div></div></article>
      <article class="case"><span class="case-kicker">03 · Сотрудник</span><h3>Карточка и отпуска</h3><p>Профессии, комментарий и несколько периодов отпуска в течение года находятся в одной карточке.</p><div class="sheet"><div class="sheet-title"><span>Сотрудник</span><span>×</span></div><div class="field"><label>ФИО</label><div class="input">Кузнецов Илья Андреевич</div></div><div class="field"><label>Должность / доп. профессия</label><div class="input">Пожарный · ГДЗС</div></div><div class="vacation-pill"><span>09.09 — 19.09</span><span>×</span></div><div class="vacation-pill"><span>22.10 — 24.10</span><span>×</span></div><button class="wide-action">＋ Добавить отпуск</button></div></article>
      <article class="case"><span class="case-kicker">04 · ПТВ</span><h3>Экземпляры и количество</h3><p>Один сценарий для номерного оборудования и массовых позиций. Комментарий хранится у каждого экземпляра.</p><div class="sheet"><div class="sheet-title"><span>Добавить оборудование</span><span>×</span></div><div class="toggle"><span class="on">По экземплярам</span><span>Количество</span></div><div class="field" style="margin-top:8px"><label>Наименование</label><div class="input">Багор</div></div><div class="option"><span><b>Экземпляр №235325</b><small>АЦ-720 · исправно</small></span><span>›</span></div><div class="option"><span><b>Экземпляр №1234</b><small>Склад · неисправно · ручка</small></span><span>›</span></div><span class="badge good">＋ Добавить экземпляр</span></div></article>
      <article class="case"><span class="case-kicker">05 · Доступ</span><h3>Роли и приглашения</h3><p>Создание в модалках, компактные списки, раскрытие по нажатию и явное подтверждение удаления.</p><div class="sheet"><div class="sheet-title"><span>Дмитрий Иванов</span><span>×</span></div><div class="field"><label>Роль</label><div class="input">Редактор⌄</div></div><div class="option"><span><b>Права роли</b><small>Раскладка, сотрудники, работа</small></span><span class="badge">7 / 10</span></div><button class="wide-action" style="background:color-mix(in srgb,var(--bad) 25%,var(--surface));color:var(--bad)">Удалить из караула</button><div class="option selected" style="margin-top:10px"><span><b>Подтвердите удаление</b><small>Пользователь потеряет доступ</small></span><span>!</span></div></div></article>
      <article class="case"><span class="case-kicker">06 · Результат</span><h3>PNG-превью</h3><p>Предпросмотр перед сохранением: видны дата, приоритет РТП, отсутствующие и периоды отпусков.</p><div class="sheet"><div class="sheet-title"><span>Готовая раскладка</span><span>×</span></div><div class="preview"><div class="preview-lines"><i></i><i></i><i></i></div></div><div class="toggle" style="margin-top:9px"><span>Назад</span><span class="on">Скачать PNG</span></div></div></article>`;

    document.querySelector("#gallery").innerHTML = variants.map((variant) => `<section class="concept ${variant.cls}" id="${variant.key}"><header class="concept-head"><div><span class="eyebrow">Вариант ${variant.index}</span><h1>${variant.title}</h1><p>${variant.note}</p></div><div class="palette">${variant.colors.map(c=>`<span class="swatch" style="background:${c}"></span>`).join("")}</div></header><div class="screen-grid">${roster()}${stats()}${employees()}${work()}${access()}${entry()}</div><h2 class="section-title">Ключевые сценарии и состояния</h2><div class="case-grid">${cases()}</div><footer class="footer-note"><span>Мобильный приоритет · вертикальный экран · 5 основных вкладок</span><span>Все данные и имена в макетах демонстрационные</span></footer></section>`).join("");
  </script>
