name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check application and deployment files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check deployment scripts
        run: shellcheck scripts/*.sh

      - name: Check Dockerfile
        run: docker build --check .

      - name: Validate Docker Compose files
        env:
          ZXCCARAUL_IMAGE: ghcr.io/example/zxccaraul:test
          COMPOSE_PROJECT_NAME: zxccaraul-ci
          POSTGRES_DB: caraul
          POSTGRES_USER: caraul
          APP_STATE_ID: main
          APP_PORT: "5173"
        run: |
          set -euo pipefail

          mkdir -p secrets
          trap 'rm -rf secrets' EXIT
          printf '%s' 'compose-validation-only' > secrets/postgres_password

          docker compose -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
